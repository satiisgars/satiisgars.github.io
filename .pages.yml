# Pages CMS 설정 — https://app.pagescms.org 에서 GitHub 계정으로 로그인하면
# 아래 항목을 웹 화면에서 바로 작성·수정할 수 있습니다. 저장하면 이 저장소에 커밋되고
# GitHub Pages가 1~2분 안에 사이트를 다시 빌드합니다.

media:
  input: assets/img
  output: /assets/img

content:
  - name: notice
    label: 학회소식 (공지사항)
    type: collection
    path: _notice
    filename: "{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, category, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 작성일
        type: date
        required: true
      - name: category
        label: 분류
        type: select
        default: 공지
        options:
          values: [공지, 워크샵, 세미나, 교육, 행사]
      - name: pinned
        label: 목록 맨 위에 고정
        type: boolean
        default: false
      - name: summary
        label: 요약 (검색·공유 미리보기용, 선택)
        type: text
      - name: image
        label: 대표 이미지 / 포스터 (선택)
        type: image
      - name: attachments
        label: 첨부파일 (선택)
        type: file
        list: true
        options:
          input: assets/files
          output: /assets/files

      # ---------- 행사 공지 양식 (워크샵·세미나 등) — 비워 두면 표시되지 않습니다 ----------
      - name: intro
        label: "① 인사말 (예: 회원 여러분, 안녕하세요…)"
        type: text
      - name: overview_title
        label: "② 개요 제목 (기본값: 행사 개요)"
        type: string
      - name: overview
        label: "② 개요 표 (일시·장소·주제·참석대상 등)"
        type: object
        list: true
        fields:
          - { name: label, label: 항목, type: string }
          - { name: value, label: 내용, type: string }
      - name: program
        label: "③ 프로그램 세부일정 (일자별)"
        type: object
        list: true
        fields:
          - { name: day, label: "날짜 (예: 10.7.(수))", type: string }
          - { name: label, label: "부제 (예: 1일차)", type: string }
          - name: rows
            label: 시간표
            type: object
            list: true
            fields:
              - { name: time, label: "시간 (예: 09:00–09:30)", type: string }
              - { name: duration, label: "소요 (예: 30’)", type: string }
              - name: kind
                label: 구분 (행 색상)
                type: select
                default: 일반
                options:
                  values: [일반, 개회, 강연, 세션, 발표, 휴식, 식사, 현장]
              - { name: title, label: 발표주제 및 내용, type: string }
              - { name: detail, label: "부가설명 / 좌장 (선택)", type: text }
              - { name: speaker, label: 발표자, type: string }
              - { name: affiliation, label: 소속, type: string }
      - name: fees
        label: "④ 등록비 표"
        type: object
        fields:
          - { name: title, label: "제목 (기본값: 등록비 안내)", type: string }
          - { name: headers, label: "머리글 (예: 구분, 일반, 학생, 비고)", type: string, list: true }
          - name: rows
            label: 행
            type: object
            list: true
            fields:
              - { name: cells, label: "칸 (머리글 순서대로)", type: string, list: true }
      - name: fee_notes
        label: "④ 등록 안내 문구 (**굵게** 사용 가능)"
        type: string
        list: true
      - name: register
        label: "⑤ 사전등록 버튼"
        type: object
        fields:
          - { name: heading, label: "제목 (기본값: 사전등록하기)", type: string }
          - { name: text, label: 안내 문구, type: string }
          - { name: label, label: "버튼 글자 (기본값: 사전등록 신청하기)", type: string }
          - { name: url, label: "신청 링크 (Google Form 등)", type: string }
      - name: sections
        label: "⑥ 추가 안내 섹션 (특별세션 신청 안내 등)"
        type: object
        list: true
        fields:
          - { name: heading, label: 제목, type: string }
          - { name: content, label: 내용, type: rich-text }
          - { name: button_label, label: 버튼 글자 (선택), type: string }
          - { name: button_url, label: 버튼 링크 (선택), type: string }
          - name: button_style
            label: 버튼 모양
            type: select
            default: 기본
            options:
              values: [기본, 보조]
      - name: body
        label: "⑦ 본문 (자유 작성 — 양식 외 내용)"
        type: rich-text
      - name: venue
        label: "⑧ 행사장 안내"
        type: object
        fields:
          - { name: name, label: 행사장, type: string }
          - { name: address, label: 주소, type: string }
          - { name: map_url, label: "지도 링크 (네이버지도 등)", type: string }
      - name: sponsors
        label: "⑨ 후원"
        type: string
        list: true
      - name: closing
        label: "⑩ 맺음말 (아래에 '위성지능정보학회 드림'이 자동으로 붙습니다)"
        type: text

  - name: event
    label: 대표 행사 (홈 화면·행사일정)
    type: file
    path: _data/event.yml
    format: yaml
    fields:
      - name: title
        label: 행사명
        type: string
        required: true
      - name: poster
        label: 포스터 (원본)
        type: image
      - name: thumb
        label: 홈 카드용 이미지 (선택, 가벼운 JPG 권장)
        type: image
      - name: when
        label: 일시
        type: string
      - name: where
        label: 장소
        type: string
      - name: theme
        label: 주제
        type: string
      - name: notice
        label: 상세 안내 글 주소 (예 /notice/num_5)
        type: string
      - name: register
        label: 사전등록 링크
        type: string
      - name: ad
        label: 광고 페이지
        type: object
        fields:
          - name: title
            label: 제목
            type: string
          - name: image
            label: 이미지
            type: image
